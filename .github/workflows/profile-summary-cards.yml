

on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically every night at midnight
  workflow_dispatch:

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This ensures it has permission to save the image

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest Streak Stats (Dark & Light)
        run: |
          curl -s "https://streak-stats.demolab.com/?user=FahimAhamed0602&theme=github-dark" -o streak-dark.svg
          curl -s "https://streak-stats.demolab.com/?user=FahimAhamed0602&theme=default" -o streak-light.svg

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak-dark.svg streak-light.svg
          git commit -m "⚡ Auto-update streak stats" || exit 0
          git push
